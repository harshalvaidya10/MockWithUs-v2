services:
  backend:
    build:
      context: ./backend
    container_name: mockwithus-backend
    env_file:
      - ./backend/.env
    environment:
      CODE_EXECUTION_MODE: remote
      CODE_EXECUTOR_URL: http://executor:9000
      CODE_EXECUTOR_SHARED_SECRET: ${CODE_EXECUTOR_SHARED_SECRET:-mockwithus-local-executor-secret}
    volumes:
      - ./backend/uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      executor:
        condition: service_healthy
    networks:
      - app_net
      - exec_net
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  executor:
    build:
      context: ./backend
      dockerfile: Dockerfile.executor
    container_name: mockwithus-executor
    environment:
      CODE_EXECUTION_MODE: local
      CODE_EXECUTOR_SHARED_SECRET: ${CODE_EXECUTOR_SHARED_SECRET:-mockwithus-local-executor-secret}
      CODE_EXEC_MEMORY_LIMIT_BYTES: ${CODE_EXEC_MEMORY_LIMIT_BYTES:-268435456}
      CODE_EXEC_MAX_PROCESSES: ${CODE_EXEC_MAX_PROCESSES:-32}
      CODE_EXEC_MAX_FILE_SIZE_BYTES: ${CODE_EXEC_MAX_FILE_SIZE_BYTES:-33554432}
      CODE_EXEC_MAX_OPEN_FILES: ${CODE_EXEC_MAX_OPEN_FILES:-64}
      HOME: /tmp
    expose:
      - "9000"
    read_only: true
    tmpfs:
      - /tmp:size=256m,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exec_net

  db:
    image: pgvector/pgvector:pg16
    container_name: mockwithus-db
    environment:
      POSTGRES_DB: mockwithus
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mockwithus"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app_net

  adminer:
    image: adminer:4
    container_name: mockwithus-adminer
    profiles:
      - devtools
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - app_net

volumes:
  pgdata:

networks:
  app_net:
  exec_net:
    internal: true
